[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-framework"
version = "0.1.0"
description = "ACE (Autonomous Cognitive Entity) local-first framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ace = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
